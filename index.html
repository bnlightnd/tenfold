<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}body{font:14px system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
</style>
<title>Tenfold</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tenfold">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen arcade cabinet — score strip, square 10x10 well, three-slot tray. Deliberately single dark theme. */
:root {
  --bg: #000000;
  --well: #0b0b0b;
  --empty: #1a1a1a;
  --empty-edge: #2e2e2e;
  --fg: #ffffff;
  --muted: #8a8a8a;
  --accent: #ffffff;
  --ok: rgba(255,255,255,.22);
  --c1: #ffffff; --c2: #f2f2f2; --c3: #e4e4e4; --c4: #d6d6d6;
  --c5: #ececec; --c6: #c8c8c8; --c7: #f8f8f8; --c8: #dcdcdc; --c9: #efefef;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.app {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center;
  gap: 14px;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header {
  width: var(--bw); display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px;
}
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat.right { align-items: flex-end; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; }
#score { font-size: 34px; color: var(--accent); transition: transform .15s; display: inline-block; }
#score.bump { transform: scale(1.12); }
h1 { margin: 0; font-family: var(--display); font-size: 15px; letter-spacing: .06em; text-align: center; color: var(--muted); }
h1 b { color: var(--fg); font-weight: 400; }
.center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.icon-btn {
  font: 600 12px var(--body); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); background: transparent; border: 1px solid var(--empty-edge);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.icon-btn:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.board-wrap { position: relative; }
.board {
  --gap: 3px;
  width: var(--bw); aspect-ratio: 1; max-width: 100%;
  box-sizing: border-box; padding: 6px; border-radius: 12px;
  background: var(--well);
  display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); gap: var(--gap);
  touch-action: none;
  box-shadow: 0 0 0 2px #ffffff;
}
.cell { border-radius: 5px; background: var(--empty); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
.cell.filled, .blk {
  background: var(--col);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.16);
}

.float, .float-inner { backface-visibility: hidden; }
.cell.ghost { background: rgba(255,255,255,.28); box-shadow: none; }
.cell.line:not(.filled):not(.ghost) { background: #3a3a3a; }
.cell.line.filled { background: #ffffff; box-shadow: 0 0 0 1px #fff, 0 0 10px rgba(255,255,255,.5); }
.cell.vanish { animation: vanish .3s cubic-bezier(.5,0,.75,0) both; animation-delay: var(--d, 0ms); }
@keyframes vanish {
  0% { transform: scale(1); }
  30% { transform: scale(1.08); }
  100% { transform: scale(0); opacity: 0; }
}
.cell.land { animation: land .16s ease-out; }
@keyframes land { 0% { transform: scale(.92); } 100% { transform: scale(1); } }

.tray {
  width: var(--bw); flex: 1; min-height: 110px; max-height: 190px;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  touch-action: none;
}
.slot { display: grid; place-items: center; position: relative; }
.piece { display: grid; gap: 2px; cursor: grab; padding: 10px; touch-action: none; }
.piece.dead { opacity: .28; filter: grayscale(.7); cursor: not-allowed; }
.piece.lifted { visibility: hidden; }
.piece .blk, .piece .sp { width: var(--mini); height: var(--mini); border-radius: 3px; }
.piece .sp { visibility: hidden; }

.float { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; will-change: transform; }
.float.glide { transition: transform .18s cubic-bezier(.2,.8,.3,1); }
.float.snap { transition: transform .08s cubic-bezier(.3,.7,.4,1); }
.float-inner { display: grid; }
.float .blk { box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.16); }
.float .blk, .float .sp { border-radius: 5px; }
.float .sp { visibility: hidden; }
.slot { cursor: grab; touch-action: none; }

.toast {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
  font-family: var(--display); font-size: 30px; color: var(--accent); pointer-events: none;
  text-shadow: 0 3px 0 rgba(0,0,0,.4); white-space: nowrap;
  animation: rise .9s ease-out forwards;
}
.toast small { display: block; font-size: 15px; color: var(--fg); text-align: center; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -110%); } }

.over {
  position: absolute; inset: 0; border-radius: 12px; z-index: 5;
  background: rgba(10,12,18,.84); backdrop-filter: blur(3px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px;
}
.over h2 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 400; }
.over p { margin: 0; color: var(--muted); font-size: 15px; }
.over .big { font-family: var(--display); font-size: 44px; color: var(--accent); }
.best-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-align: right; }
.tops { list-style: none; margin: 4px 0 0; padding: 0; width: min(240px, 100%); display: flex; flex-direction: column; gap: 4px; }
.tops li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--empty); font-variant-numeric: tabular-nums; }
.tops li span { color: var(--muted); font-size: 13px; }
.tops li b { font-family: var(--display); font-weight: 400; font-size: 18px; text-align: left; }
.tops li em { font-style: normal; color: var(--muted); font-size: 13px; }
.tops li.me { background: #fff; color: #000; }
.tops li.me span, .tops li.me em { color: #444; }
.btn {
  margin-top: 6px; font: 700 16px var(--body); color: #000; background: var(--accent);
  border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
}
.confirm { display: flex; gap: 8px; }
.confirm .btn.alt { background: var(--empty); color: var(--fg); }

@media (prefers-reduced-motion: reduce) {
  .cell.vanish, .cell.land, .toast { animation-duration: .01s; }
  #score, .float.glide, .float.snap, .float-inner { transition: none; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header>
    <div class="stat"><span class="label">Score</span><span class="num" id="score">0</span></div>
    <div class="center"><h1><b>TEN</b>FOLD</h1><button class="icon-btn" id="restart" type="button">New game</button></div>
    <button class="stat right best-btn" id="scores" type="button" aria-label="Show high scores"><span class="label">Best ▸</span><span class="num" id="best">0</span></button>
  </header>
  <div class="board-wrap" id="wrap">
    <div class="board" id="board" aria-label="10 by 10 board"></div>
  </div>
  <div class="tray" id="tray"></div>
</div>

<script>
(() => {
  const N = 10;
  const COLS = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8','--c9'];
  // [cells as [row,col]], color, weight
  const S = (cells, col, w) => ({ cells, col, w });
  const SHAPES = [
    S([[0,0]], '--c6', 1),
    S([[0,0],[0,1]], '--c2', 1), S([[0,0],[1,0]], '--c2', 1),
    S([[0,0],[0,1],[0,2]], '--c8', 1), S([[0,0],[1,0],[2,0]], '--c8', 1),
    S([[0,0],[0,1],[0,2],[0,3]], '--c7', 1), S([[0,0],[1,0],[2,0],[3,0]], '--c7', 1),
    S([[0,0],[0,1],[0,2],[0,3],[0,4]], '--c1', 1), S([[0,0],[1,0],[2,0],[3,0],[4,0]], '--c1', 1),
    S([[0,0],[0,1],[1,0],[1,1]], '--c3', 1),
    S([[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], '--c4', 1),
    S([[0,0],[1,0],[1,1]], '--c9', 1), S([[0,0],[0,1],[1,0]], '--c9', 1),
    S([[0,0],[0,1],[1,1]], '--c9', 1), S([[0,1],[1,0],[1,1]], '--c9', 1),
    S([[0,0],[1,0],[2,0],[2,1],[2,2]], '--c5', 1), S([[0,0],[0,1],[0,2],[1,0],[2,0]], '--c5', 1),
    S([[0,0],[0,1],[0,2],[1,2],[2,2]], '--c5', 1), S([[0,2],[1,2],[2,2],[2,1],[2,0]], '--c5', 1),
  ];
  const TOTAL_W = SHAPES.reduce((a, s) => a + s.w, 0);
  const dims = s => ({ h: Math.max(...s.cells.map(c => c[0])) + 1, w: Math.max(...s.cells.map(c => c[1])) + 1 });

  const KEY = 'tenfold-v1', BEST = 'tenfold-best';
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  let state, best = load(BEST) || 0;
  let tops = Array.isArray(load('tenfold-tops')) ? load('tenfold-tops') : [];

  const persist = () => { save(KEY, state); save(BEST, best); save('tenfold-tops', tops); };

  function randShape() {
    let r = Math.random() * TOTAL_W;
    for (let i = 0; i < SHAPES.length; i++) { r -= SHAPES[i].w; if (r < 0) return i; }
    return 0;
  }
  function fresh() {
    return { grid: Array(N * N).fill(null), tray: [randShape(), randShape(), randShape()], score: 0, streak: 0, over: false };
  }

  const fits = (grid, s, r, c) => s.cells.every(([dr, dc]) => {
    const rr = r + dr, cc = c + dc;
    return rr >= 0 && rr < N && cc >= 0 && cc < N && !grid[rr * N + cc];
  });
  const fitsAnywhere = (grid, s) => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (fits(grid, s, r, c)) return true;
    return false;
  };
  function linesAfter(grid, s, r, c) {
    const g = grid.slice();
    s.cells.forEach(([dr, dc]) => g[(r + dr) * N + c + dc] = 'x');
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      let fr = true, fc = true;
      for (let j = 0; j < N; j++) { if (!g[i * N + j]) fr = false; if (!g[j * N + i]) fc = false; }
      if (fr) rows.push(i); if (fc) cols.push(i);
    }
    const set = new Set();
    rows.forEach(i => { for (let j = 0; j < N; j++) set.add(i * N + j); });
    cols.forEach(i => { for (let j = 0; j < N; j++) set.add(j * N + i); });
    return { count: rows.length + cols.length, cells: set };
  }

  // ---------- DOM ----------
  const app = document.getElementById('app');
  const boardEl = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const cellEls = [];
  for (let i = 0; i < N * N; i++) { const d = document.createElement('div'); d.className = 'cell'; boardEl.appendChild(d); cellEls.push(d); }

  function size() {
    const h = app.clientHeight, w = app.clientWidth - 32;
    const bw = Math.max(240, Math.min(w, 520, h - 230));
    app.style.setProperty('--bw', bw + 'px');
    app.style.setProperty('--mini', Math.max(12, Math.floor(bw / 10 * 0.5)) + 'px');
  }
  window.addEventListener('resize', size);
  document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (drag) e.preventDefault(); });

  function renderBoard(preview) {
    const g = state.grid;
    for (let i = 0; i < N * N; i++) {
      const el = cellEls[i];
      el.className = 'cell';
      el.style.removeProperty('--col');
      if (g[i]) { el.classList.add('filled'); el.style.setProperty('--col', `var(${g[i]})`); }
    }
    if (preview) {
      const s = SHAPES[preview.shape];
      s.cells.forEach(([dr, dc]) => {
        const el = cellEls[(preview.r + dr) * N + preview.c + dc];
        el.classList.add('ghost'); el.style.setProperty('--col', `var(${s.col})`);
      });
      preview.lines.cells.forEach(i => cellEls[i].classList.add('line'));
    }
    shown = { ghost: new Set(preview ? SHAPES[preview.shape].cells.map(([dr, dc]) => (preview.r + dr) * N + preview.c + dc) : []), line: new Set(preview ? preview.lines.cells : []) };
  }

  let shown = { ghost: new Set(), line: new Set() };
  function setPreview(preview) {
    const ghost = new Set(), line = new Set();
    if (preview) {
      SHAPES[preview.shape].cells.forEach(([dr, dc]) => ghost.add((preview.r + dr) * N + preview.c + dc));
      preview.lines.cells.forEach(i => line.add(i));
    }
    shown.ghost.forEach(i => { if (!ghost.has(i)) cellEls[i].classList.remove('ghost'); });
    shown.line.forEach(i => { if (!line.has(i)) cellEls[i].classList.remove('line'); });
    ghost.forEach(i => { if (!shown.ghost.has(i)) cellEls[i].classList.add('ghost'); });
    line.forEach(i => { if (!shown.line.has(i)) cellEls[i].classList.add('line'); });
    shown = { ghost, line };
  }

  function pieceGrid(el, s, sizeVar) {
    const { h, w } = dims(s);
    el.style.gridTemplateColumns = `repeat(${w}, ${sizeVar})`;
    el.style.gridTemplateRows = `repeat(${h}, ${sizeVar})`;
    el.innerHTML = '';
    const on = new Set(s.cells.map(([r, c]) => r * 10 + c));
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const b = document.createElement('div');
      if (on.has(r * 10 + c)) { b.className = 'blk'; b.style.setProperty('--col', `var(${s.col})`); }
      else b.className = 'sp';
      el.appendChild(b);
    }
  }

  function renderTray() {
    trayEl.innerHTML = '';
    state.tray.forEach((idx, slot) => {
      const sl = document.createElement('div'); sl.className = 'slot'; sl.dataset.slot = slot;
      if (idx !== null) {
        const p = document.createElement('div'); p.className = 'piece';
        pieceGrid(p, SHAPES[idx], 'var(--mini)');
        if (!fitsAnywhere(state.grid, SHAPES[idx])) p.classList.add('dead');
        sl.appendChild(p);
        sl.addEventListener('pointerdown', startDrag);
      }
      trayEl.appendChild(sl);
    });
  }

  function renderScore(bump) {
    scoreEl.textContent = state.score;
    bestEl.textContent = Math.max(best, state.score);
    if (bump) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); setTimeout(() => scoreEl.classList.remove('bump'), 160); }
  }

  function renderOver() {
    wrap.querySelector('.over')?.remove();
    if (!state.over) return;
    const o = document.createElement('div'); o.className = 'over';
    const record = state.score >= best && state.score > 0;
    o.innerHTML = `<h2>No room left</h2><div class="big">${state.score}</div><p>${record ? 'New best score.' : 'Best: ' + best}</p>${topsHtml(state.score)}<button class="btn" id="again" type="button">Play again</button>`;
    wrap.appendChild(o);
    o.querySelector('#again').addEventListener('click', newGame);
  }

  function topsHtml(mark, n = 5) {
    if (!tops.length) return '';
    let marked = false;
    return '<ol class="tops">' + tops.slice(0, n).map((x, i) => {
      const me = !marked && x.s === mark && state.over && (marked = true);
      const d = new Date(x.t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      return `<li class="${me ? 'me' : ''}"><span>${i + 1}</span><b>${x.s}</b><em>${d}</em></li>`;
    }).join('') + '</ol>';
  }
  function showScores() {
    if (wrap.querySelector('.over')) return;
    const o = document.createElement('div'); o.className = 'over';
    o.innerHTML = `<h2>High scores</h2>${tops.length ? topsHtml(-1, 10) : '<p>Finish a game to set your first score.</p>'}<button class="btn" id="close" type="button">Back to game</button>`;
    wrap.appendChild(o);
    o.querySelector('#close').addEventListener('click', () => o.remove());
  }

  function renderAll() { renderBoard(); renderTray(); renderScore(); renderOver(); }

  function toast(text, sub) {
    const t = document.createElement('div'); t.className = 'toast';
    t.innerHTML = text + (sub ? `<small>${sub}</small>` : '');
    wrap.appendChild(t); setTimeout(() => t.remove(), 950);
  }

  // ---------- drag ----------
  let drag = null, busy = false;
  function metrics() {
    const a = cellEls[0].getBoundingClientRect(), b = cellEls[1].getBoundingClientRect();
    return { x0: a.left, y0: a.top, cell: a.width, pitch: b.left - a.left };
  }

  // Find the nearest legal spot within about one cell of where the piece is hovering.
  function snapTarget(s, fr, fc) {
    const r0 = Math.round(fr), c0 = Math.round(fc);
    if (fits(state.grid, s, r0, c0)) return { r: r0, c: c0 };
    let bestPos = null, bestD = 1.15;
    for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
      const d = Math.hypot(r - fr, c - fc);
      if (d < bestD && fits(state.grid, s, r, c)) { bestD = d; bestPos = { r, c }; }
    }
    return bestPos;
  }

  function startDrag(e) {
    if (state.over || drag || busy) return;
    if (e.button !== undefined && e.button !== 0) return;
    const slotEl = e.currentTarget;
    const slot = +slotEl.dataset.slot;
    const idx = state.tray[slot]; if (idx === null) return;
    e.preventDefault();
    const pieceEl = slotEl.querySelector('.piece');
    const m = metrics(), s = SHAPES[idx], { h, w } = dims(s);
    const f = document.createElement('div'); f.className = 'float';
    const inner = document.createElement('div'); inner.className = 'float-inner';
    inner.style.gap = (m.pitch - m.cell) + 'px';
    pieceGrid(inner, s, m.cell + 'px');
    f.appendChild(inner);
    const pw = w * m.pitch - (m.pitch - m.cell), ph = h * m.pitch - (m.pitch - m.cell);
    const pr = pieceEl.getBoundingClientRect();
    const mini = (pr.width - 20) / pw; // piece has 10px padding each side
    const home = { x: pr.left + pr.width / 2 - pw / 2, y: pr.top + pr.height / 2 - ph / 2 };
    const lift = e.pointerType === 'mouse' ? ph / 2 : ph + m.pitch * 0.75;
    drag = { slot, idx, el: f, inner, slotEl, pieceEl, m, pw, ph, mini, home, pos: null, lift, x: e.clientX, y: e.clientY, raf: 0 };

    // start shrunk exactly over the tray piece, then grow and glide up to the finger
    f.style.transform = `translate3d(${e.clientX - pw / 2}px, ${e.clientY - lift}px, 0)`;
    inner.style.transformOrigin = `50% ${Math.min(100, (lift / ph) * 100)}%`;
    document.body.appendChild(f);
    pieceEl.classList.add('lifted');

    try { slotEl.setPointerCapture(e.pointerId); } catch {}
    slotEl.addEventListener('pointermove', moveDrag);
    slotEl.addEventListener('pointerup', endDrag);
    slotEl.addEventListener('pointercancel', endDrag);
    frame();
  }

  function moveDrag(e) {
    if (!drag) return;
    const ev = e.getCoalescedEvents ? (e.getCoalescedEvents().slice(-1)[0] || e) : e;
    drag.x = ev.clientX; drag.y = ev.clientY;
    if (!drag.raf) drag.raf = requestAnimationFrame(frame);
  }

  function frame() {
    if (!drag) return;
    drag.raf = 0;
    const x = drag.x - drag.pw / 2, y = drag.y - drag.lift;
    drag.el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    const m = drag.m, s = SHAPES[drag.idx];
    const fr = (y - m.y0) / m.pitch, fc = (x - m.x0) / m.pitch;
    let pos = snapTarget(s, fr, fc);
    if (pos && drag.pos && (pos.r !== drag.pos.r || pos.c !== drag.pos.c)) {
      const dOld = Math.hypot(drag.pos.r - fr, drag.pos.c - fc), dNew = Math.hypot(pos.r - fr, pos.c - fc);
      if (dOld < 0.85 && dOld - dNew < 0.2) pos = drag.pos;
    }
    const same = pos && drag.pos && pos.r === drag.pos.r && pos.c === drag.pos.c;
    if (same) return;
    if (!pos && !drag.pos) return;
    drag.pos = pos;
    setPreview(pos ? { shape: drag.idx, r: pos.r, c: pos.c, lines: linesAfter(state.grid, s, pos.r, pos.c) } : null);
  }

  function endDrag(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.raf) cancelAnimationFrame(d.raf);
    d.slotEl.removeEventListener('pointermove', moveDrag);
    d.slotEl.removeEventListener('pointerup', endDrag);
    d.slotEl.removeEventListener('pointercancel', endDrag);
    busy = true;
    if (d.pos && e.type === 'pointerup') {
      // glide into the exact cells, then commit
      d.el.remove(); busy = false;
      try { navigator.vibrate && navigator.vibrate(8); } catch {}
      place(d.slot, d.idx, d.pos.r, d.pos.c);
      return;
    }
    setPreview(null);
    d.el.remove(); d.pieceEl.classList.remove('lifted'); busy = false;
  }

  // ---------- game ----------
  function place(slot, idx, r, c) {
    const s = SHAPES[idx];
    const lines = linesAfter(state.grid, s, r, c);
    const placed = s.cells.map(([dr, dc]) => (r + dr) * N + c + dc);
    placed.forEach(i => state.grid[i] = s.col);
    let gained = s.cells.length;
    if (lines.count) {
      state.streak++;
      const n = lines.count;
      gained += 10 * n * (n + 1) / 2 + (state.streak > 1 ? 10 * (state.streak - 1) * n : 0);
    } else state.streak = 0;
    state.score += gained;
    state.tray[slot] = null;
    if (state.tray.every(t => t === null)) state.tray = [randShape(), randShape(), randShape()];

    lines.cells.forEach(i => { state.grid[i] = null; });
    renderBoard();
    if (lines.count) {
      const words = ['', '', 'Double', 'Triple', 'Quad', 'Wow'];
      const sub = state.streak > 1 ? `streak ×${state.streak}` : (words[Math.min(lines.count, 5)] || '');
      toast('+' + gained, sub);
    }

    state.over = state.tray.filter(t => t !== null).every(t => !fitsAnywhere(state.grid, SHAPES[t]));
    if (state.score > best) best = state.score;
    if (state.over && state.score > 0) tops = mergeTops(tops, [{ s: state.score, t: Date.now() }]);
    renderTray(); renderScore();
    persist();
    if (state.over) renderOver();
  }

  function newGame() { state = fresh(); persist(); renderAll(); }

  // restart with an in-page confirm
  document.getElementById('scores').addEventListener('click', showScores);
  const restartBtn = document.getElementById('restart');
  restartBtn.addEventListener('click', () => {
    if (state.over || state.score === 0) return newGame();
    if (wrap.querySelector('.over')) return;
    const o = document.createElement('div'); o.className = 'over';
    o.innerHTML = `<h2>Start over?</h2><p>Your current score of ${state.score} will be lost.</p><div class="confirm"><button class="btn alt" id="keep" type="button">Keep playing</button><button class="btn" id="yes" type="button">New game</button></div>`;
    wrap.appendChild(o);
    o.querySelector('#keep').addEventListener('click', () => o.remove());
    o.querySelector('#yes').addEventListener('click', newGame);
  });

  function valid(s) {
    return s && Array.isArray(s.grid) && s.grid.length === N * N && Array.isArray(s.tray) && s.tray.length === 3 &&
      s.tray.every(t => t === null || (Number.isInteger(t) && t >= 0 && t < SHAPES.length));
  }

  function start(data) {
    const saved = data && data.state;
    state = valid(saved) ? saved : (valid(load(KEY)) ? load(KEY) : fresh());
    if (state.tray.every(t => t === null)) state.tray = [randShape(), randShape(), randShape()];
    size(); renderAll();
  }
  window.claude?.hot?.snapshot?.(() => ({ state }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
